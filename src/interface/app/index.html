<!DOCTYPE html>
<!--
  客户端界面(原型阶段:用 mock.js 的假事件流驱动)

  刻意**不显示** turn / token / 压缩次数 / trace 路径 —— 那些是内部调试信息,
  东西。这里只呈现三样用户真正要看的:思考过程、工具调用、回答正文。

  用普通 <script> 而非 type="module":后者在 file:// 下受 CORS 限制打不开,
  而「双击就能看」是原型阶段最重要的性质。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BaseAgent</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="bar">
  <div class="brand">BaseAgent</div>
  <div class="bar-right">
    <span class="ws" id="ws-label" title="当前工作区"></span>
    <!--
      技能按钮:有待审批时显示一个计数角标。
      不做成消息流里的弹窗 —— 审批要看清步骤和坑才能判断,
      塞在流里容易随手点过,而错批一条含糊描述的代价是它永久误导模型。
    -->
    <button class="icon-btn" id="btn-skills" title="技能库">
      ✦<span class="badge" id="skill-badge" hidden></span>
    </button>
    <button class="icon-btn" id="btn-config" title="配置">⚙</button>
    <!--
      窗口按钮:顶栏是自绘的(titleBarStyle: 'hidden'),系统按钮不存在。
      顺序按 Windows 习惯(最小化 / 最大化 / 关闭),关闭单独给红色 hover。
    -->
    <div class="win-btns">
      <button class="win-btn" id="btn-min" title="最小化">&#xE921;</button>
      <button class="win-btn" id="btn-max" title="最大化">&#xE922;</button>
      <button class="win-btn close" id="btn-close" title="关闭">&#xE8BB;</button>
    </div>
  </div>
</header>

<!-- 顶栏之下分两列:历史侧边栏 + 对话主区 -->
<div class="body-row">

  <!--
    历史会话侧边栏

    标题取每个会话第一条用户提问的截断(见 session-store.ts 的 titleOf)。
    列表由主进程扫目录得来,不维护索引文件 —— 索引和真实目录不一致时
    列表里会出现打不开的条目。
  -->
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <button class="btn new-chat" id="btn-new">＋ 新对话</button>
      <!--
        执行中锁住切换入口时的说明。
        没有这句话时按钮只是点不动 —— 而「点了没反应」和「界面卡了」
        在用户眼里是同一回事,所以必须说出原因和出路。
      -->
      <p class="hint busy-lock" id="busy-lock-hint" hidden>
        执行中,暂时不能切换会话。要切请先点「停止」。
      </p>
    </div>
    <div class="side-list" id="side-list"></div>
  </aside>

  <div class="main-col">
    <!--
      对话箱体

      为什么给对话区加一层边框而不是让它铺满主区:铺满时内容从窗口边缘直接
      开始、也直接到底,视觉上没有「这段到此为止」的界线 —— 于是最后一条
      离输入框只有几像素,分不清哪里是内容尽头、哪里是控件。
      箱体同时是「回到底部」按钮的定位基准(position: relative)。
    -->
    <div class="stream-box" id="stream-box">
      <main id="stream" class="stream"></main>

      <!--
        回到底部。只在用户往上翻走之后出现 —— 常驻会挡住右下角的正文,
        而贴着底部时它没有任何用处。
      -->
      <button class="to-bottom" id="btn-to-bottom" title="回到最新" hidden>↓</button>
    </div>

    <footer class="composer">
      <textarea id="input" rows="1" placeholder="描述你要做的事…  (Enter 发送,Shift+Enter 换行)"></textarea>
      <button id="btn-send" class="send">发送</button>
      <button id="btn-stop" class="stop" hidden>停止</button>
    </footer>
  </div>

</div>

<!-- 配置抽屉 -->
<div class="drawer-mask" id="drawer-mask" hidden></div>
<aside class="drawer" id="drawer" hidden>
  <div class="drawer-head">
    <h2>配置</h2>
    <button class="icon-btn" id="btn-close-config">✕</button>
  </div>

  <div class="drawer-body">
    <section>
      <h3>模型</h3>
      <label>API Key
        <!-- 只显示掩码,不回填明文。留空 = 不修改 -->
        <input type="password" id="cfg-key" placeholder="sk-••••••••1234(留空则不修改)">
      </label>
      <label>Base URL
        <input type="text" id="cfg-baseurl" placeholder="https://api.deepseek.com">
      </label>
      <label>主模型
        <input type="text" id="cfg-model" placeholder="deepseek-v4-flash">
      </label>
      <label>视觉模型 <span class="hint">留空则不启用视觉能力</span>
        <input type="text" id="cfg-vision" placeholder="(未配置)">
      </label>
    </section>

    <section>
      <h3>工作区 <span class="hint">agent 唯一的读写范围</span></h3>
      <div class="path-row">
        <input type="text" id="cfg-workspace" readonly placeholder="(未选择)">
        <button class="btn" id="btn-pick">选择…</button>
      </div>
      <p class="warn" id="ws-warn" hidden>未选择工作区时,所有文件类工具与代码执行都会被拒绝。</p>
    </section>

    <section>
      <h3>本机数据 <span class="hint">配置、历史、trace、记忆和浏览器登录态</span></h3>
      <div class="path-row">
        <input type="text" id="cfg-data-dir" readonly placeholder="(仅 Electron 客户端可见)">
        <button class="btn" id="btn-open-data">打开</button>
      </div>
    </section>

    <section>
      <h3>能力</h3>
      <label class="row"><input type="checkbox" id="cfg-python"> 代码执行(Python 沙箱)</label>
      <label class="row"><input type="checkbox" id="cfg-danger"> 允许危险工具</label>
      <label class="row"><input type="checkbox" id="cfg-shell"> 执行外部命令 <span class="hint" id="shell-hint"></span></label>
      <label class="row"><input type="checkbox" id="cfg-subagent"> 子 agent</label>
      <label class="row"><input type="checkbox" id="cfg-memory"> 长期记忆</label>
    </section>

    <!--
      这一组与上面几组的区别:填错了**看不见**。
      模型名填错马上报错、工作区没选马上有告警,而这三项填错只表现成
      「回答莫名被截断」「任务半途停下」「变慢」—— 所以每一项都要
      写出默认值和范围,留空即回落。
    -->
    <section>
      <h3>运行参数 <span class="hint">留空 = 用默认值</span></h3>

      <label>单次生成上限
        <input type="number" id="cfg-maxtokens" min="256" max="200000" step="256"
               placeholder="(默认:不限制,由服务端决定)">
        <span class="hint">思维链<strong>计入</strong>这个预算 —— 给小了正文会空。压缩摘要默认跟随它。</span>
      </label>

      <label>最大工具调用轮数
        <input type="number" id="cfg-maxsteps" min="1" max="200" step="1"
               placeholder="(默认:20)">
        <span class="hint">用满了会中止并标记 max_steps,模型不知道自己被截断。</span>
      </label>

      <label class="row">
        <input type="checkbox" id="cfg-thinking"> 输出思考过程
        <span class="hint">关掉能砍掉首字延迟的大头(实测占等待时间过半),代价是回答质量。</span>
      </label>
    </section>
  </div>

  <div class="drawer-foot">
    <span class="hint" id="restart-hint" hidden>这些改动需要重建会话才生效</span>
    <!--
      保存会重建会话(dispose 掉当前这个),而进行中的那一轮跑在旧实例上 ——
      工具桥和 DB 句柄被关掉之后它会开始报一串莫名的工具失败。
      所以执行期间禁用保存,并说清为什么。
    -->
    <span class="hint" id="save-busy-hint" hidden>执行中不能保存(保存会重建会话)</span>
    <button class="btn primary" id="btn-save">保存</button>
  </div>
</aside>

<!--
  技能抽屉 —— 审批待入库的技能

  为什么审批必须是个能慢慢看的面板,而不是消息流里的一张卡:
  判断一条技能值不值得留,要看清它的步骤和坑 —— 描述含糊的技能
  (「知乎相关操作」这种)等于不存在,模型永远不会选它,而没有任何
  自动信号能发现这件事。塞在流里容易随手点过,而错批一条的代价是
  它永久占着索引预算、或更糟:被选中然后误导模型。

  与配置抽屉共用 .drawer 那套样式和遮罩层级,但**各自一个遮罩** ——
  共用一个的话关掉技能抽屉会把配置抽屉的遮罩也带走。
-->
<div class="drawer-mask" id="skill-mask" hidden></div>
<aside class="drawer" id="skill-drawer" hidden>
  <div class="drawer-head">
    <h2>技能库</h2>
    <button class="icon-btn" id="btn-close-skills">✕</button>
  </div>

  <div class="drawer-body" id="skill-body">
    <!-- 内容由 app.js 的 renderSkills() 填充 -->
  </div>

  <div class="drawer-foot">
    <span class="hint">通过审批后才会进入提示词索引,模型才可能用到它。</span>
    <!--
      审批**不影响当前对话** —— 技能索引在会话装配时拼进 system 消息就冻住了,
      之后没有任何路径会重算它。这不是懒,是刻意的:system 消息是 prompt cache
      前缀里最稳定的部分(实测命中率 60~77%),为一次审批重写它会让整段缓存失效。
      所以说清「下次新对话生效」,与配置面板那个 restart-hint 同一个模式。
    -->
    <span class="hint" id="skill-apply-hint" hidden>已审批的技能在<strong>下次新对话</strong>生效。</span>
  </div>
</aside>

<!-- 危险工具确认。命令**原样**呈现是这个对话框全部的意义 -->
<div class="modal-mask" id="confirm-mask" hidden>
  <div class="modal">
    <h3 id="confirm-title">需要确认</h3>
    <pre id="confirm-body" class="verbatim"></pre>
    <p class="hint">请读清楚要执行的内容。这一步没有其他机制拦得住它。</p>
    <div class="modal-foot">
      <button class="btn" id="btn-deny">拒绝</button>
      <button class="btn danger" id="btn-allow">允许执行</button>
    </div>
  </div>
</div>

<!--
  顺序有意义:app.js 定义渲染层,bridge.js 在 Electron 里接真实 IPC,
  mock.js 只在没有 AgentBridge 时接手(双击本文件看界面的场景)。
-->
<!-- md.js 必须在 app.js 之前:后者在渲染回答时要用 window.AgentMarkdown -->
<script src="md.js"></script>
<script src="app.js"></script>
<script src="bridge.js"></script>
<script src="mock.js"></script>
</body>
</html>
